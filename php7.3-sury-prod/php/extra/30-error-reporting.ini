; Always silence deprecation notices (E_DEPRECATED and E_USER_DEPRECATED),
; e.g. phpredis Redis::setTimeout() on 5.3.7. Applies to both CLI and FPM.
; NOTE: app code calling error_reporting() at runtime still overrides this —
; keep bootstrap/autoloader.php in sync (exclude E_DEPRECATED there too).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
