; Upload defaults — ~50M files out of the box.
; Applies to BOTH cli and fpm SAPIs (Dockerfile copies php/extra/*.ini
; into /etc/php/7.3/{cli,fpm}/conf.d/).
; post_max_size / memory_limit / nginx client_max_body_size (conf.d/20-upload.conf,
; http scope) all headroom above upload_max_filesize to cover multipart
; overhead + GD/Imagick (decompressed bitmaps run much larger than the PNG).
file_uploads = On
upload_max_filesize = 48M
post_max_size = 64M
memory_limit = 512M
max_file_uploads = 20
