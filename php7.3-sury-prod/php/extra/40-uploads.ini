; Upload defaults — 24M files out of the box.
; Applies to BOTH cli and fpm SAPIs (Dockerfile copies php/extra/*.ini
; into /etc/php/7.3/{cli,fpm}/conf.d/).
; post_max_size / memory_limit / nginx client_max_body_size all headroom
; above upload_max_filesize to cover multipart overhead + GD/Imagick.
file_uploads = On
upload_max_filesize = 24M
post_max_size = 32M
memory_limit = 256M
max_file_uploads = 20
