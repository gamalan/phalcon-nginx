# Upload cap default (http scope).
# NOTE: http-level on purpose — a server-level `client_max_body_size` mounted
# via /etc/nginx/app.d/ (e.g. prod 20-upload.conf) *overrides* this instead of
# erroring with "directive is duplicate" (which kills nginx when set twice in
# the same server block). Must stay >= PHP post_max_size (64M).
client_max_body_size 64M;
