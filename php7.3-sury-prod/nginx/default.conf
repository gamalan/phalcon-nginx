server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    # NOTE: entrypoint.sh rewrites this root and fastcgi_param APPLICATION_PATH
    # from $APPLICATION_PATH (default /app): <path>/public if it holds index.php,
    # else <path> itself.
    root /app/public;
    index index.php index.html;

    # Security headers. `always` => also sent on error responses.
    # NOTE: add_header is NOT inherited by a location block that sets its own
    # add_header — repeat what's needed there (see nginx/app.d example).
    add_header X-Content-Type-Options nosniff always;
    # NOTE: no X-Frame-Options by default — framing policy may need to change
    # per deployment; set it via nginx/app.d/ when decided.
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Phalcon rewrite (same behaviour as old webdevops vhost.common.d)
    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }

    # Static assets: open CORS so app/service-worker origins can fetch fonts,
    # manifests, CSS/JS cross-origin (e.g. aplikasi.* fetching static.*).
    # NOTE: this block sets its own add_header, so it does NOT inherit the
    # server-level security headers — nosniff is repeated here deliberately.
    location ~* \.(css|js|mjs|json|webmanifest|xml|txt|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|otf|map)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param APPLICATION_PATH /app;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }

    # Custom drop-ins: any *.conf placed in nginx/app.d/ (repo) is copied to
    # /etc/nginx/app.d/ and included here. Use for extra locations, auth,
    # headers, etc. without touching this file. Files load alphabetically —
    # prefix with NN- (e.g. 10-extra.conf).
    include /etc/nginx/app.d/*.conf;
}
